<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre Mini — Phase 2: Raster Tiles</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      height: 100vh;
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #eee;
    }
    #map-container {
      flex: 1;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls {
      width: 280px;
      padding: 20px;
      background: #222;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    h1 { font-size: 1rem; font-weight: 600; color: #fff; }
    label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 4px; }
    input[type=range] { width: 100%; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .value { font-size: 0.85rem; color: #fff; font-variant-numeric: tabular-nums; }
    .center-display {
      font-size: 0.85rem;
      color: #aaa;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      line-height: 1.6;
    }
    footer {
      font-size: 0.75rem;
      color: #666;
      margin-top: auto;
    }
    footer a { color: #888; }
  </style>
</head>
<body>
  <div id="map-container">
    <canvas id="map"></canvas>
  </div>
  <div id="controls">
    <h1>MapLibre Mini — Phase 2</h1>

    <div class="field">
      <label for="zoom-slider">Zoom</label>
      <input type="range" id="zoom-slider" min="0" max="18" step="0.1" value="10" />
      <span class="value" id="zoom-value">10.0</span>
    </div>

    <div class="center-display">
      <strong>Center</strong><br />
      Amsterdam<br />
      4.9°E, 52.37°N
    </div>

    <footer>
      © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>
    </footer>
  </div>

  <script type="module" src="./phase-2-raster.ts"></script>
</body>
</html>
