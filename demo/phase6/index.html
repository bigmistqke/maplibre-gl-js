<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phase 6 — Globe Projection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
    canvas { display: block; flex: 1; }
    #sidebar {
      width: 220px;
      padding: 16px;
      background: #1a1a1a;
      border-left: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .back { font-size: 11px; opacity: 0.4; text-decoration: none; color: inherit; }
    .back:hover { opacity: 0.8; }
    .phase-badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.3; }
    h2 { font-size: 14px; }
    label { font-size: 12px; opacity: 0.6; display: block; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: #4af; }
    .field { display: flex; flex-direction: column; gap: 2px; }
    .value { font-size: 11px; opacity: 0.4; }
    button { background: #2a2a2a; border: 1px solid #3a3a3a; color: #eee; padding: 6px 10px; font-size: 12px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #333; }
    button.active { border-color: #4af; color: #4af; }
    #status { font-size: 11px; opacity: 0.35; margin-top: auto; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div id="sidebar">
    <a class="back" href="../">← all demos</a>
    <div>
      <div class="phase-badge">Phase 6</div>
      <h2>Globe Projection</h2>
    </div>
    <div class="field">
      <label>Zoom</label>
      <input type="range" id="zoom" min="0" max="6" step="0.1" value="2" />
      <span class="value" id="zoom-val">2.0</span>
    </div>
    <div class="field">
      <label>Bearing</label>
      <input type="range" id="bearing" min="0" max="360" step="1" value="0" />
      <span class="value" id="bearing-val">0°</span>
    </div>
    <div class="field">
      <label>Pitch</label>
      <input type="range" id="pitch" min="0" max="85" step="1" value="0" />
      <span class="value" id="pitch-val">0°</span>
    </div>
    <button id="rotate-btn">⟳ Auto-rotate</button>
    <div id="status">Initializing…</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
