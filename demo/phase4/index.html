<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phase 4 — Worker Tile Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
    canvas { display: block; flex: 1; }
    #sidebar {
      width: 220px;
      padding: 16px;
      background: #1a1a1a;
      border-left: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .back { font-size: 11px; opacity: 0.4; text-decoration: none; color: inherit; }
    .back:hover { opacity: 0.8; }
    .phase-badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.3; }
    h2 { font-size: 14px; }
    label { font-size: 12px; opacity: 0.6; display: block; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: #4af; }
    .field { display: flex; flex-direction: column; gap: 2px; }
    .value { font-size: 11px; opacity: 0.4; }
    .stats {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stat { display: flex; justify-content: space-between; font-size: 12px; }
    .stat-label { opacity: 0.45; }
    .stat-value { font-variant-numeric: tabular-nums; font-weight: 600; }
    .worker-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2a2a2a;
      flex-shrink: 0;
    }
    .dot.active { background: #4f4; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    #status { font-size: 11px; opacity: 0.35; margin-top: auto; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div id="sidebar">
    <a class="back" href="../">← all demos</a>
    <div>
      <div class="phase-badge">Phase 4</div>
      <h2>Worker Tile Service</h2>
    </div>
    <div class="field">
      <label>Zoom</label>
      <input type="range" id="zoom" min="0" max="18" step="0.1" value="5" />
      <span class="value" id="zoom-val">5.0</span>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="stat-label">Tiles loaded</span>
        <span class="stat-value" id="stat-loaded">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Avg decode (ms)</span>
        <span class="stat-value" id="stat-avg">—</span>
      </div>
      <div class="worker-badge">
        <div class="dot" id="worker-dot"></div>
        <span id="worker-label">Worker idle</span>
      </div>
    </div>
    <div id="status">Initializing…</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
