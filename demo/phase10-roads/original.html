<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phase 10 — Road Labels (MapLibre Original)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #1a1a1a; color: #eee; font-family: system-ui, sans-serif; }
    #map { flex: 1; }
    .panel { width: 240px; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: #222; }
    .panel h2 { font-size: 14px; opacity: 0.6; }
    .panel h1 { font-size: 18px; }
    label { font-size: 12px; opacity: 0.5; }
    input[type=range] { width: 100%; }
    #status { font-size: 11px; opacity: 0.4; margin-top: auto; }
    a { color: #4af; font-size: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <a href="../">← all demos</a>
    <h2>PHASE 10 — ORIGINAL</h2>
    <h1>Road Name Labels</h1>
    <div>
      <label>Zoom</label>
      <input type="range" id="zoom" min="0" max="16" step="0.1" value="14" />
      <span id="zoom-val">14.0</span>
    </div>
    <div id="status">Loading…</div>
  </div>
  <script type="module" src="./original.ts"></script>
</body>
</html>
